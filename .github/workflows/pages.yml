name: Build and Deploy

on:
  workflow_dispatch:
  push:
    paths:
      - src/docsosf/html/**

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master
      - name: Checkout
        uses: actions/checkout@master
        with:
          repository: dectalk/dectalk-de
          path: dist
          persist-credentials: false
          fetch-depth: 0
      - name: Build website
        run: |
          cp -R src/docsosf/html dist/manual
          cp dist/manual/dectalk.htm dist/manual/index.htm
          cd dist/
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add . && git diff --staged --quiet || git commit -am "${{ github.event.repository.name }} / ${{ github.event.head_commit.message }}"
      - name: Commit & Push changes
        uses: ad-m/github-push-action@master
        with:
          directory: dist
          repository: dectalk/dectalk-de
          github_token: ${{ secrets.DEPLOY_TOKEN }}
